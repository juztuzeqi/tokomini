<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Struk Top-up KP2A</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; font-family: system-ui, sans-serif; }
  body { margin: 0; padding: 16px; background: #f4f4f4; max-width: 480px; margin: auto; }
  h2 { margin: 8px 0; }
  .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  button { border: none; border-radius: 8px; padding: 12px 16px; font-size: 15px; cursor: pointer; }
  .btn-primary { background: #2563eb; color: #fff; width: 100%; }
  .btn-green { background: #16a34a; color: #fff; width: 100%; }
  .btn-gray { background: #e5e7eb; color: #111; }
  .btn-nom { background: #f3f4f6; color: #111; flex: 1; }
  .btn-nom.aktif { background: #2563eb; color: #fff; }
  #reader { width: 100%; border-radius: 8px; overflow: hidden; display: none; margin-top: 8px; }
  input[type=number] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; margin-top: 8px; }
  .muted { color: #666; font-size: 13px; }
  .nama-siswa { font-weight: bold; font-size: 17px; margin-top: 4px; }
  .kode-siswa { color: #666; font-size: 13px; }
  .nominal-row { display: flex; gap: 8px; margin-top: 8px; }

  /* Struk */
  #strukArea { display: none; }
  .struk {
    background: #fff; border: 1px dashed #999; border-radius: 8px; padding: 16px;
    font-family: 'Courier New', monospace; font-size: 14px; line-height: 1.5;
  }
  .struk .judul { text-align: center; font-weight: bold; font-size: 15px; }
  .struk .garis { border-top: 1px dashed #999; margin: 8px 0; }
  .struk .baris { display: flex; justify-content: space-between; }

  @media print {
    body { background: #fff; padding: 0; }
    .card, button, #reader, .muted { display: none !important; }
    #strukArea { display: block !important; }
    .struk { border: none; }
  }
</style>
</head>
<body>

<h2>🧾 Struk Top-up KP2A</h2>

<div class="card" id="panelScan">
  <button class="btn-primary" onclick="toggleScan()">📷 Scan Kartu Siswa</button>
  <div id="reader"></div>
  <div id="infoSiswa" style="display:none;margin-top:10px;">
    <div class="nama-siswa" id="namaSiswa"></div>
    <div class="kode-siswa" id="kodeSiswa"></div>
  </div>
</div>

<div class="card" id="panelNominal" style="display:none;">
  <strong>Pilih Nominal</strong>
  <div class="nominal-row">
    <button class="btn-nom" onclick="pilihNominal(5000)">Rp5.000</button>
    <button class="btn-nom" onclick="pilihNominal(10000)">Rp10.000</button>
    <button class="btn-nom" onclick="pilihNominal(20000)">Rp20.000</button>
  </div>
  <input type="number" id="nominalManual" placeholder="Atau ketik nominal..." oninput="nominalManualChanged()">
  <button class="btn-green" style="margin-top:12px;" onclick="buatStruk()">Buat Struk</button>
</div>

<div id="strukArea">
  <div class="struk" id="strukIsi"></div>
  <div style="display:flex;gap:8px;margin-top:12px;" class="card">
    <button class="btn-primary" onclick="window.print()">🖨️ Cetak / Simpan PDF</button>
    <button class="btn-gray" onclick="resetHalaman()">🔄 Scan Lagi</button>
  </div>
</div>

<script>
let daftarSiswa = [];
let scanTarget = null;
let siswaTerpilih = null;
let nominalTerpilih = 0;

// ===== Load CSV siswa =====
fetch('data-siswa.csv').then(r => r.text()).then(txt => {
  const lines = txt.trim().split('\n').slice(1);
  daftarSiswa = lines.map(l => {
    const [kode_siswa, nama] = l.split(',');
    return { kode_siswa: (kode_siswa || '').trim(), nama: (nama || '').trim() };
  }).filter(s => s.kode_siswa);
  console.log('Siswa loaded:', daftarSiswa.length);
}).catch(e => alert('Gagal memuat data-siswa.csv: ' + e));

// ===== Scan kartu =====
function toggleScan() {
  const reader = document.getElementById('reader');
  if (reader.style.display === 'block') { hentikanScan(); return; }
  reader.style.display = 'block';
  const qr = new Html5Qrcode('reader');
  qr.start({ facingMode: 'environment' }, { fps: 10, qrbox: 250 },
    (decoded) => { hentikanScan(); prosesKartu(decoded.trim()); },
    () => {}
  ).catch(e => alert('Kamera gagal: ' + e));
  scanTarget = qr;
}
function hentikanScan() {
  if (scanTarget) { scanTarget.stop().then(() => scanTarget.clear()); scanTarget = null; }
  document.getElementById('reader').style.display = 'none';
}

function prosesKartu(kode) {
  const s = daftarSiswa.find(x => x.kode_siswa === kode);
  if (!s) return alert('Kartu tidak terdaftar di data-siswa.csv: ' + kode);
  siswaTerpilih = s;
  document.getElementById('namaSiswa').textContent = s.nama;
  document.getElementById('kodeSiswa').textContent = s.kode_siswa;
  document.getElementById('infoSiswa').style.display = 'block';
  document.getElementById('panelNominal').style.display = 'block';
  document.getElementById('strukArea').style.display = 'none';
  nominalTerpilih = 0;
  document.getElementById('nominalManual').value = '';
  document.querySelectorAll('.btn-nom').forEach(b => b.classList.remove('aktif'));
}

// ===== Nominal =====
function pilihNominal(n) {
  nominalTerpilih = n;
  document.getElementById('nominalManual').value = '';
  document.querySelectorAll('.btn-nom').forEach(b => {
    b.classList.toggle('aktif', b.textContent.replace(/\D/g, '') === String(n));
  });
}
function nominalManualChanged() {
  const v = document.getElementById('nominalManual').value;
  nominalTerpilih = v ? Number(v) : 0;
  document.querySelectorAll('.btn-nom').forEach(b => b.classList.remove('aktif'));
}

// ===== Buat struk =====
function buatStruk() {
  if (!siswaTerpilih) return alert('Scan kartu dulu.');
  if (!nominalTerpilih || nominalTerpilih <= 0) return alert('Pilih atau isi nominal dulu.');

  const tgl = new Date().toLocaleString('id-ID', { dateStyle: 'long', timeStyle: 'short' });
  const isi = `
    <div class="judul">TANDA TERIMA TOP UP<br>TOKO MINI KP2A KINTAMANI</div>
    <div class="garis"></div>
    <div class="baris"><span>Tanggal</span><span>${tgl}</span></div>
    <div class="baris"><span>Nama Siswa</span><span>${siswaTerpilih.nama}</span></div>
    <div class="baris"><span>Kode Siswa</span><span>${siswaTerpilih.kode_siswa}</span></div>
    <div class="garis"></div>
    <div class="baris"><strong>Nominal</strong><strong>Rp${nominalTerpilih.toLocaleString('id-ID')}</strong></div>
    <div class="garis"></div>
    <div style="text-align:center;font-size:12px;margin-top:8px;">Terima kasih telah melakukan top up.</div>
  `;
  document.getElementById('strukIsi').innerHTML = isi;
  document.getElementById('strukArea').style.display = 'block';
  document.getElementById('panelNominal').style.display = 'none';
  document.getElementById('panelScan').style.display = 'none';
}

// ===== Reset =====
function resetHalaman() {
  siswaTerpilih = null;
  nominalTerpilih = 0;
  document.getElementById('infoSiswa').style.display = 'none';
  document.getElementById('panelScan').style.display = 'block';
  document.getElementById('panelNominal').style.display = 'none';
  document.getElementById('strukArea').style.display = 'none';
  document.getElementById('nominalManual').value = '';
  if (scanTarget) hentikanScan();
}
</script>
</body>
</html>
