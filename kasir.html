<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kasir Toko Mini KP2A</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; font-family: system-ui, sans-serif; }
  body { margin: 0; padding: 16px; background: #f4f4f4; max-width: 520px; margin: auto; }
  h2 { margin: 8px 0; }
  .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  button { border: none; border-radius: 8px; padding: 12px 16px; font-size: 15px; cursor: pointer; }
  .btn-primary { background: #2563eb; color: #fff; width: 100%; }
  .btn-green { background: #16a34a; color: #fff; width: 100%; }
  .btn-gray { background: #e5e7eb; color: #111; }
  .btn-red { background: #dc2626; color: #fff; }
  #reader, #readerKartu { width: 100%; border-radius: 8px; overflow: hidden; display: none; margin-top: 8px; }
  .row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid #eee; }
  .total { font-weight: bold; font-size: 18px; }
  input[type=text] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 15px; }
  .muted { color: #666; font-size: 13px; }
  .badge { display: inline-block; background: #eef; padding: 2px 8px; border-radius: 6px; font-size: 12px; }
  .saldo-box { background: #f0fdf4; border: 1px solid #86efac; border-radius: 8px; padding: 10px; margin-top: 8px; display: none; }
</style>
</head>
<body>

<h2>🛒 Kasir KP2A</h2>

<!-- SCAN / KETIK BARANG -->
<div class="card">
  <button class="btn-primary" onclick="toggleScan()">📷 Scan Barcode</button>
  <div id="reader"></div>
  <div style="margin-top:8px;display:flex;gap:8px;">
    <input type="text" id="ketikBarang" list="listBarang" placeholder="Ketik nama / kode barang..." onchange="pilihBarang()">
    <datalist id="listBarang"></datalist>
    <button class="btn-gray" onclick="pilihBarang()">+</button>
  </div>
</div>

<!-- KERANJANG -->
<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <strong>Keranjang</strong>
    <button class="btn-red" style="padding:4px 10px;font-size:13px;" onclick="kosongkan()">Kosongkan</button>
  </div>
  <div id="keranjang"><div class="muted">Belum ada barang.</div></div>
  <div class="row total" style="border:none;"><span>Total</span><span id="total">Rp0</span></div>
</div>

<!-- PEMBAYARAN -->
<div class="card">
  <strong>Pembayaran</strong>
  <div style="display:flex;gap:8px;margin-top:10px;">
    <button class="btn-green" onclick="bukaPotongSaldo()">💳 Potong Saldo</button>
    <button class="btn-primary" onclick="bukaQRIS()">📱 QRIS</button>
  </div>

  <!-- Panel Potong Saldo -->
  <div id="panelSaldo" style="display:none;margin-top:12px;">
    <button class="btn-primary" style="margin-bottom:8px;" onclick="scanKartuSiswa()">📷 Scan Kartu Siswa</button>
    <div id="readerKartu"></div>
    <input type="text" id="ketikSiswa" list="listSiswa" placeholder="atau ketik nama siswa..." onchange="pilihSiswa()">
    <datalist id="listSiswa"></datalist>
    <div id="saldoBox" class="saldo-box"></div>
    <button class="btn-green" style="margin-top:10px;" onclick="bayarPotong()">Konfirmasi Potong Saldo</button>
  </div>
</div>

<!-- MODAL QRIS -->
<div id="qrModal" class="card" style="display:none;text-align:center;">
  <p><strong>Scan QRIS KP2A</strong></p>
  <img src="qris.png" alt="QRIS" style="width:220px;height:220px;object-fit:contain;border:1px solid #ddd;border-radius:8px;">
  <p class="muted">Setelah bayar, tekan tombol di bawah.</p>
  <button class="btn-green" onclick="konfirmasiQRIS()">✅ Sudah Bayar</button>
</div>

<script>
// ================= KONFIG =================
const API_URL = 'https://script.google.com/macros/s/AKfycbyYlNBATsmb0uBavxhtTrI33yP3Rs6q-2lMuvWA7lelY9x0QNEsn3U4ixuBJLgXMru_3w/exec';

let barang = [];
let siswa = [];
let keranjang = []; // {barcode, nama, harga, qty}
let scanTarget = null;
let scanKartuTarget = null;
let siswaTerpilih = null;

// ================= LOAD BARANG (CSV) =================
fetch('data-barang.csv').then(r => r.text()).then(txt => {
  const lines = txt.trim().split('\n').slice(1);
  barang = lines.map(l => {
    const [barcode, nama, harga, aktif] = l.split(',');
    return { barcode: barcode.trim(), nama: nama.trim(), harga: +harga, aktif: +aktif === 1 };
  }).filter(b => b.aktif);
  isiDatalistBarang();
  console.log('Barang loaded:', barang.length);
});

// ================= LOAD SISWA (APPS SCRIPT) =================
fetch(API_URL + '?action=siswa').then(r => r.json()).then(j => {
  if (!j.ok) throw new Error(j.error || 'Gagal memuat siswa');
  siswa = (j.siswa || []).map(s => ({ ...s }));
  isiDatalistSiswa();
  console.log('Siswa loaded:', siswa.length);
}).catch(e => {
  console.warn('Gagal load siswa dari Apps Script:', e);
  alert('Gagal memuat data siswa dari server. Cek koneksi.');
});

// ================= SCAN BARANG =================
function toggleScan() {
  const reader = document.getElementById('reader');
  if (reader.style.display === 'block') { hentikanScan(); return; }
  reader.style.display = 'block';
  const qr = new Html5Qrcode('reader');
  qr.start({ facingMode: 'environment' }, { fps: 10, qrbox: 250 },
    (decoded) => { hentikanScan(); prosesKode(decoded); },
    () => {}
  ).catch(e => alert('Kamera gagal: ' + e));
  scanTarget = qr;
}
function hentikanScan() {
  if (scanTarget) { scanTarget.stop().then(() => scanTarget.clear()); scanTarget = null; }
  document.getElementById('reader').style.display = 'none';
}

// ================= KETIK / PILIH BARANG =================
function isiDatalistBarang() {
  document.getElementById('listBarang').innerHTML =
    barang.map(b => `<option value="${b.nama}">`).join('');
}
function pilihBarang() {
  const val = document.getElementById('ketikBarang').value.trim();
  if (!val) return;
  let b = barang.find(x => x.barcode === val) || barang.find(x => x.nama.toLowerCase() === val.toLowerCase());
  if (!b) return alert('Barang tidak ditemukan: ' + val);
  tambahKeKeranjang(b);
  document.getElementById('ketikBarang').value = '';
}

// ================= KERANJANG =================
function prosesKode(kode) {
  const b = barang.find(x => x.barcode === kode.trim());
  if (!b) return alert('Barang tidak ditemukan: ' + kode);
  tambahKeKeranjang(b);
}
function tambahKeKeranjang(b) {
  const existing = keranjang.find(x => x.barcode === b.barcode);
  if (existing) { existing.qty++; }
  else { keranjang.push({ barcode: b.barcode, nama: b.nama, harga: b.harga, qty: 1 }); }
  render();
}
function kosongkan() { keranjang = []; render(); }
function hapus(i) { keranjang.splice(i, 1); render(); }

function render() {
  const el = document.getElementById('keranjang');
  if (!keranjang.length) { el.innerHTML = '<div class="muted">Belum ada barang.</div>'; }
  else {
    el.innerHTML = keranjang.map((b, i) =>
      `<div class="row"><span>${b.nama} × ${b.qty} <span class="badge">${b.barcode}</span></span>
       <span>Rp${(b.harga * b.qty).toLocaleString('id-ID')}
       <button class="btn-red" style="padding:2px 6px;font-size:11px;" onclick="hapus(${i})">x</button></span></div>`
    ).join('');
  }
  const total = keranjang.reduce((s, b) => s + b.harga * b.qty, 0);
  document.getElementById('total').textContent = 'Rp' + total.toLocaleString('id-ID');
}

// ================= SISWA / SALDO =================
function isiDatalistSiswa() {
  document.getElementById('listSiswa').innerHTML =
    siswa.map(s => `<option value="${s.nama}">`).join('');
}
function pilihSiswa() {
  const val = document.getElementById('ketikSiswa').value.trim();
  if (!val) return;
  const s = siswa.find(x => x.kode_siswa === val) || siswa.find(x => x.nama.toLowerCase().trim() === val.toLowerCase().trim());
  if (!s) { siswaTerpilih = null; document.getElementById('saldoBox').style.display = 'none'; return alert('Siswa tidak ditemukan: ' + val); }
  siswaTerpilih = s;
  tampilkanSaldo();
}
function tampilkanSaldo() {
  if (!siswaTerpilih) return;
  const saldo = Number(siswaTerpilih.saldo) || 0;
  const box = document.getElementById('saldoBox');
  box.style.display = 'block';
  box.innerHTML = `<strong>${siswaTerpilih.nama}</strong> (${siswaTerpilih.kode_siswa})<br>
    Saldo: <strong>Rp${saldo.toLocaleString('id-ID')}</strong>`;
}

// ================= SCAN KARTU SISWA =================
function scanKartuSiswa() {
  const container = document.getElementById('readerKartu');
  if (container.style.display === 'block' || scanKartuTarget) { hentikanScanKartu(); return; }
  container.style.display = 'block';
  const qr = new Html5Qrcode('readerKartu');
  qr.start({ facingMode: 'environment' }, { fps: 10, qrbox: 250 },
    (decoded) => {
      hentikanScanKartu();
      const kode = decoded.trim();
      const s = siswa.find(x => x.kode_siswa === kode);
      if (!s) return alert('Kartu tidak dikenali: ' + kode);
      siswaTerpilih = s;
      document.getElementById('ketikSiswa').value = s.nama;
      tampilkanSaldo();
    },
    () => {}
  ).catch(e => alert('Kamera gagal: ' + e));
  scanKartuTarget = qr;
}
function hentikanScanKartu() {
  if (scanKartuTarget) {
    scanKartuTarget.stop().then(() => {
      scanKartuTarget.clear();
      scanKartuTarget = null;
      document.getElementById('readerKartu').style.display = 'none';
    });
  }
}

// ================= PEMBAYARAN =================
function bukaPotongSaldo() {
  if (!keranjang.length) return alert('Keranjang kosong.');
  const panel = document.getElementById('panelSaldo');
  panel.style.display = panel.style.display === 'block' ? 'none' : 'block';
}
function bukaQRIS() {
  if (!keranjang.length) return alert('Keranjang kosong.');
  document.getElementById('qrModal').style.display = 'block';
}

function bayarPotong() {
  if (!keranjang.length) return alert('Keranjang kosong.');
  if (!siswaTerpilih) return alert('Pilih siswa dulu.');
  const total = keranjang.reduce((s, b) => s + b.harga * b.qty, 0);
  const saldo = Number(siswaTerpilih.saldo) || 0;
  if (saldo < total) return alert(`Saldo ${siswaTerpilih.nama}: Rp${saldo.toLocaleString('id-ID')} — tidak cukup.`);

  const payload = {
    action: 'bayar',
    kode_siswa: siswaTerpilih.kode_siswa,
    nama: siswaTerpilih.nama,
    total: total,
    metode: 'potong_saldo',
    items: keranjang
  };

  fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  })
  .then(r => r.json())
  .then(j => {
    if (!j.ok) return alert('Gagal: ' + (j.error || 'tidak diketahui'));
    alert(`✅ ${siswaTerpilih.nama} — Rp${total.toLocaleString('id-ID')}\nSisa saldo: Rp${Number(j.saldo_baru).toLocaleString('id-ID')}`);
    siswaTerpilih.saldo = j.saldo_baru;
    tampilkanSaldo();
    keranjang = [];
    render();
  })
  .catch(e => alert('Gagal kirim transaksi: ' + e));
}

function konfirmasiQRIS() {
  const total = keranjang.reduce((s, b) => s + b.harga * b.qty, 0);
  const payload = {
    action: 'bayar',
    kode_siswa: '-',
    nama: 'QRIS',
    total: total,
    metode: 'qris',
    items: keranjang
  };
  fetch(API_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify(payload)
  })
  .then(r => r.json())
  .then(j => {
    if (!j.ok) return alert('Gagal: ' + (j.error || 'tidak diketahui'));
    alert(`✅ QRIS — Rp${total.toLocaleString('id-ID')}`);
    document.getElementById('qrModal').style.display = 'none';
    keranjang = [];
    render();
  })
  .catch(e => alert('Gagal kirim transaksi: ' + e));
}

// init
render();
</script>
</body>
</html>
