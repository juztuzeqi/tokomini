<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cek Saldo KP2A</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; font-family: system-ui, sans-serif; }
  body { margin: 0; padding: 16px; background: #f4f4f4; max-width: 480px; margin: auto; }
  h2 { margin: 8px 0; }
  .card { background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
  button { border: none; border-radius: 8px; padding: 12px 16px; font-size: 15px; cursor: pointer; }
  .btn-primary { background: #2563eb; color: #fff; width: 100%; }
  .btn-gray { background: #e5e7eb; color: #111; width: 100%; }
  #reader { width: 100%; border-radius: 8px; overflow: hidden; display: none; margin-top: 8px; }
  .muted { color: #666; font-size: 13px; }
  .saldo-besar { font-size: 28px; font-weight: bold; color: #16a34a; }
  .riwayat-item { padding: 8px 0; border-bottom: 1px solid #eee; font-size: 14px; }
  .riwayat-item:last-child { border-bottom: none; }
  .riwayat-tgl { color: #666; font-size: 12px; }
</style>
</head>
<body>

<h2>💳 Cek Saldo KP2A</h2>

<div class="card">
  <button class="btn-primary" onclick="toggleScan()">📷 Scan Kartu Siswa</button>
  <div id="reader"></div>
  <p class="muted" style="margin-top:8px;">Scan kartu untuk melihat saldo dan riwayat.</p>
</div>

<div id="hasil" style="display:none;">
  <div class="card">
    <div id="namaSiswa" style="font-weight:bold;font-size:16px;"></div>
    <div id="kodeSiswa" class="muted"></div>
    <div style="margin-top:12px;">
      <div class="muted">Saldo</div>
      <div id="saldoSiswa" class="saldo-besar">Rp0</div>
    </div>
  </div>

  <div class="card">
    <strong>Riwayat (5 terakhir)</strong>
    <div id="riwayatList" style="margin-top:8px;"></div>
  </div>

  <button class="btn-gray" onclick="resetHalaman()">🔄 Scan Kartu Lain</button>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbyYlNBATsmb0uBavxhtTrI33yP3Rs6q-2lMuvWA7lelY9x0QNEsn3U4ixuBJLgXMru_3w/exec';

let scanTarget = null;

function toggleScan() {
  const reader = document.getElementById('reader');
  if (reader.style.display === 'block') { hentikanScan(); return; }
  reader.style.display = 'block';
  const qr = new Html5Qrcode('reader');
  qr.start({ facingMode: 'environment' }, { fps: 10, qrbox: 250 },
    (decoded) => {
      hentikanScan();
      prosesKartu(decoded.trim());
    },
    () => {}
  ).catch(e => alert('Kamera gagal: ' + e));
  scanTarget = qr;
}

function hentikanScan() {
  if (scanTarget) {
    scanTarget.stop().then(() => {
      scanTarget.clear();
      scanTarget = null;
      document.getElementById('reader').style.display = 'none';
    });
  }
}

function prosesKartu(kode) {
  // Ambil data siswa (saldo) + riwayat sekaligus
  Promise.all([
    fetch(API_URL + '?action=siswa').then(r => r.json()),
    fetch(API_URL + '?action=riwayat&kode=' + encodeURIComponent(kode)).then(r => r.json())
  ]).then(([jSiswa, jRiwayat]) => {
    if (!jSiswa.ok) throw new Error(jSiswa.error || 'Gagal memuat siswa');
    const s = (jSiswa.siswa || []).find(x => x.kode_siswa === kode);
    if (!s) {
      alert('Kartu tidak dikenali: ' + kode);
      return;
    }

    document.getElementById('namaSiswa').textContent = s.nama;
    document.getElementById('kodeSiswa').textContent = s.kode_siswa;
    document.getElementById('saldoSiswa').textContent = 'Rp' + (Number(s.saldo) || 0).toLocaleString('id-ID');

    const riwayat = (jRiwayat.ok ? jRiwayat.riwayat : []).slice().reverse().slice(0, 5);
    const list = document.getElementById('riwayatList');
    if (!riwayat.length) {
      list.innerHTML = '<div class="muted">Belum ada transaksi.</div>';
    } else {
      list.innerHTML = riwayat.map(r => {
        const tgl = r.waktu ? new Date(r.waktu).toLocaleString('id-ID', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : '-';
        return `<div class="riwayat-item">
          <div class="riwayat-tgl">${tgl} — ${r.metode}</div>
          <div>${r.items ? ringkasItems(r.items) : '-'}</div>
          <div style="float:right;font-weight:bold;">Rp${(Number(r.total) || 0).toLocaleString('id-ID')}</div>
          <div style="clear:both;"></div>
        </div>`;
      }).join('');
    }

    document.getElementById('hasil').style.display = 'block';
  }).catch(e => alert('Gagal memuat data: ' + e));
}

function ringkasItems(raw) {
  try {
    const items = typeof raw === 'string' ? JSON.parse(raw) : raw;
    return items.map(i => `${i.nama} × ${i.qty}`).join(', ');
  } catch { return raw; }
}

function resetHalaman() {
  document.getElementById('hasil').style.display = 'none';
  document.getElementById('reader').style.display = 'none';
  if (scanTarget) { hentikanScan(); }
}
</script>
</body>
</html>
